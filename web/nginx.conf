server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Photos up to 5 MB and documents up to 10 MB, plus form overhead.
  client_max_body_size 12m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  include /etc/nginx/snippets/security-headers.conf;

  # For the container's own health check and the load balancer.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # The API. The browser only ever talks to this one address, so the cookie is first-party and
  # SameSite=Lax is enough.
  location ^~ /api/ {
    # The interactive API documentation is for development only.
    location /api/docs { return 404; }

    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;
    # Whatever the API returns is private to the signed-in person.
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # These must always be fetched fresh, or an update never reaches people's phones.
  location ~ ^/(index\.html|ngsw\.json|ngsw-worker\.js|manifest\.webmanifest|safety-worker\.js)$ {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Built files carry a hash in their name, so they can be kept for a year.
  location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Every other address is an app page; the router decides what to show.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
  }
}
